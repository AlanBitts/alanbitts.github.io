<!-- Formulário HTML -->
<div class="flex-center" id="main-content" role="main">
<form action="mailto:rui-viveiros@hotmail.com"
method="POST"
enctype="multipart/form-data"
name="EmailForm"
role="form"
aria-label="Formulário de contacto">
    <label for="contact-name">Nome:</label><br>
    <input type="text" id="contact-name" size="30" name="Contact-Name" required minlength="3" aria-describedby="name-help"><br>
    <span id="name-help" class="sr-only">Introduza o seu nome completo</span><br>
    
    <label for="contact-email">Email:</label><br>
    <input type="email" id="contact-email" size="30" name="Contact-Email" required aria-describedby="email-help"><br>
    <span id="email-help" class="sr-only">Introduza o seu endereço de email válido</span><br> 
    
    <label for="contact-message">Mensagem:</label><br> 
    <textarea id="contact-message" name="Contact-Message" rows="10" cols="32" required minlength="10" aria-describedby="message-help"></textarea><br>
    <span id="message-help" class="sr-only">Escreva a sua mensagem com pelo menos 10 caracteres</span><br> 
    
    <button type="submit" aria-label="Enviar mensagem de contacto">Enviar</button>
</form>
